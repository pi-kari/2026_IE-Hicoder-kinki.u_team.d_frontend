# 廃止した FastAPI リポジトリ (…d_backend) の docker-compose.yml から
# db サービスだけを引き継いだもの。app サービスと depends_on は削除済み。
#
# NOTE: compose はディレクトリ名からプロジェクト名を導くため、ここでのボリュームは
# 旧リポジトリのものとは別物（空の状態から始まる）。旧データを引き継ぎたい場合は
# pg_dump / psql で移すこと。両方ともホストの 5432 を使うので同時起動は不可。
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      TZ: Asia/Tokyo
    ports:
      # ホスト側のポートは .env.local の POSTGRES_PORT で変えられる。
      # 他プロジェクトの Postgres が既に 5432 を使っている場合に 5433 などへ逃がす用。
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
